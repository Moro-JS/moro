name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

# Least-privilege default for every job; jobs that need more opt in explicitly.
permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Check formatting
        run: npm run format:check

  # Runs WITHOUT the native engine on purpose: the Node-fallback path is a
  # first-class product property and must stay green on its own.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest engine-supported line (20) through newest (26) — test what we
        # ship binaries for and what @morojs/engine requires (Node >=20).
        node-version: [20, 22, 24, 26]
        # Both ends of the engine range the framework accepts (^1.1.0): the
        # oldest (no templates, no worker-thread clustering: every new feature
        # must fall back cleanly) and the newest published (the features on).
        engine: [min, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Pin the engine leg: --no-save keeps package-lock untouched; the
      # platform package comes along as the meta package's optionalDependency.
      - name: Install @morojs/engine (${{ matrix.engine }})
        run: |
          if [ "${{ matrix.engine }}" = "min" ]; then npm install --no-save @morojs/engine@1.1.0; else npm install --no-save @morojs/engine@latest; fi
          node -e "const v=require('@morojs/engine/package.json').version; const p=require('@morojs/engine').probe(); console.log('engine', v, JSON.stringify(p.capabilities||{})); if(!p.ok) { console.error(p.error); process.exit(1) } if (process.env.ENGINE === 'min' && v !== '1.1.0') process.exit(1)"
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The worker-thread clustering fixture loads the BUILT framework (a
      # worker thread cannot go through ts-jest/tsx), so build before the
      # integration suites.
      - name: Build (cluster fixture loads dist/)
        run: npm run build

      # MORO_REQUIRE_ENGINE=1: the engine-path integration tests must RUN against
      # the npm-installed engine, not describe.skip / fall back to Node's http.
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MORO_REQUIRE_ENGINE: '1'

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Zero third-party deps means we own query/cookie/multipart/route parsing,
      # so the fuzz suite runs on every push. The seed is fixed for
      # reproducibility; the nightly job below re-runs it with a rotating seed
      # and a much higher iteration count to explore new inputs over time.
      - name: Run parser fuzz suite
        run: npm run test:fuzz
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Coverage runs once (not per matrix leg) and enforces the coverageThreshold
  # floor in jest.config.mjs, so a drop below the ratchet fails the build.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report (enforces coverageThreshold)
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate --omit=dev

  # Builds and checks the tarball a release publishes. It runs on every push
  # and pull request too, so the path a release takes is exercised long before
  # a release is cut. Everything that executes dependency or project code on
  # the way to a release happens here, in a job with no secrets and no OIDC
  # token; the publish job below receives the finished tarball and nothing else.
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: 'npm'` here on purpose: what this job builds is what gets
      # published, so it does not restore a dependency cache that other jobs
      # and workflows are able to write.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # --ignore-scripts: nothing below needs a dependency's install script
      # (the build is plain `tsc`, the validators are plain Node scripts), and
      # the root `prepare` (husky git hooks) is not needed in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The tag the release was cut from must match the version being published,
      # so a moved/mismatched tag can never ship a wrong-versioned tarball.
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: ${PKG_VERSION}   release tag: ${TAG}"
          if [ "${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build project
        run: npm run build

      - name: Validate dist
        run: node scripts/validate-dist.mjs

      # Pack once. The file made here is the file that is validated, uploaded
      # and published; its SHA-256 travels to the publish job as a job output,
      # apart from the artifact, and is checked there before publishing.
      - name: Pack
        id: pack
        run: |
          mkdir package-out
          npm pack --ignore-scripts --pack-destination package-out
          if [ "$(ls package-out | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one tarball in package-out/"
            ls -la package-out
            exit 1
          fi
          TARBALL="$(ls package-out)"
          SHA256="$(sha256sum "package-out/${TARBALL}" | cut -d' ' -f1)"
          echo "tarball: ${TARBALL}   sha256: ${SHA256}"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      # Install the tarball into a temp project and import it as a consumer
      # would; also checks the shipped source maps and the package size.
      - name: Validate the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/validate-package.mjs "package-out/${TARBALL}"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package-out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job that can publish. It holds the OIDC token npm trusts, so it
  # runs no dependency install, no build and no script from this repository:
  # there is no checkout at all. It sets up a fixed Node (for the npm bundled
  # with it), fetches the tarball the package job of this same run built,
  # checks it is that file, and hands it to `npm publish`.
  #
  # `environment: npm-publish` puts the job behind that environment's
  # protection rules (required reviewers, allowed tags), which are set in the
  # repository settings, and lets the trusted publisher on npmjs.com be bound
  # to the environment as well as to this workflow file.
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, coverage, build, security-audit, package]
    if: github.event_name == 'release' && github.event.release.prerelease == false
    environment: npm-publish
    permissions:
      id-token: write # npm trusted publishing and provenance

    steps:
      # An exact Node release, for the npm inside it: trusted publishing needs
      # npm >= 11.5.1 and Node 24.11.0 bundles npm 11.6.1, so no `npm install -g
      # npm` runs in this job. Bump the version deliberately. No `cache:` either:
      # nothing is installed here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version)   npm ${NPM_VERSION}"
          if [ "$(printf '%s\n' '11.5.1' "${NPM_VERSION}" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VERSION} cannot do trusted publishing (11.5.1 or later is needed)"
            exit 1
          fi

      # Only this run's artifacts can be fetched this way.
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-out

      # The file must be the one the package job made (same name, same
      # SHA-256), and its name must carry the version of the release tag.
      - name: Verify the tarball
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          EXPECTED_NAME="morojs-moro-${GITHUB_REF_NAME#v}.tgz"
          echo "tarball: ${TARBALL}   expected for tag ${GITHUB_REF_NAME}: ${EXPECTED_NAME}"
          if [ -z "${TARBALL}" ] || [ "${TARBALL}" != "${EXPECTED_NAME}" ]; then
            echo "::error::Tarball ${TARBALL} is not the package for release tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "package-out/${TARBALL}" | cut -d' ' -f1)"
          echo "sha256: ${ACTUAL_SHA256}   expected: ${EXPECTED_SHA256}"
          if [ -z "${EXPECTED_SHA256}" ] || [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Downloaded tarball does not match the one the package job built"
            exit 1
          fi

      # OIDC trusted publishing: npm authenticates via the id-token exchange
      # (id-token: write above + the trusted publisher configured on npmjs.com),
      # so no NPM_TOKEN is needed. --provenance publishes a signed
      # build-provenance attestation for this exact tarball, naming this
      # workflow run and commit. --ignore-scripts: publishing a tarball runs no
      # lifecycle script, and the flag keeps it that way.
      - name: Publish to NPM
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: npm publish "./package-out/${TARBALL}" --provenance --access public --ignore-scripts
